name: site

# 官网的内容是「Markdown 源 → 生成 HTML」。这条流水线守六件事：
#   1. 生成的 HTML 与 content/ 同步（有人改了 Markdown 忘了重建 → 红）
#      —— 且未跟踪的生成物也算（git diff 看不见 untracked）
#   2. 站内链接与锚点不断（改版时最容易悄悄坏掉的东西）
#   3. 官网写的事实与编译器仓的 FACTS.md 一致（抄数字一定会漂 ⇒ 这道门）
#   4. 中英两棵树页面集合一致（缺一个孪生页 → 切换器链到 404）
#   5. 正文里没有手写的事实、没有混进来的中文（两种语言不可能对不上）
#   6. 文档里的 .jhyy 示例真的能编过（读者照抄不能白费一次）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成站点
        run: python tools/build.py

      - name: 检查生成的 HTML 是否与 content/ 同步
        run: |
          if ! git diff --quiet -- '*.html' search-index.json; then
            echo "::error::content/ 改了但 HTML 没重新生成。跑 python tools/build.py 再提交。"
            git --no-pager diff --stat -- '*.html' search-index.json
            exit 1
          fi
          # git diff 看不见**未跟踪**的文件 ⇒ 新加的 content/en/** 页面
          # 若产物从未提交，会从这道门的缝里溜过去。
          untracked=$(git ls-files --others --exclude-standard -- '*.html' 'search-index.json')
          if [ -n "$untracked" ]; then
            echo "::error::有生成物未提交。跑 python tools/build.py 再提交。"
            echo "$untracked"
            exit 1
          fi

      - name: 站内链接与锚点检查
        run: python tools/build.py --check

      # 事实门要跟编译器仓对拍 —— 把那个仓也取下来。
      # 放在 vendor/ 下，tools/check_facts.py 会去那儿找。
      - name: 取编译器仓（给事实门供料）
        uses: actions/checkout@v4
        with:
          repository: JiHuiYiYou/JiHuiYiYou-compiler
          path: vendor/JiHuiYiYou

      - name: 事实对拍（siteconfig ↔ 编译器仓 FACTS.md）
        run: python tools/check_facts.py

      - name: 事实门自测（确认这道门真的会红）
        run: python tools/check_facts.py --self-test

      - name: i18n 一致性检查（字面量事实 / 英文页中文 / 术语）
        run: python tools/check_i18n.py

  # 孪生页门要求中英两棵树页面集合一致 —— 英文树还没写完时它会红，
  # 所以单开一个 job，让「主线绿」和「双语完整性」两条信号不互相盖住。
  twins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 生成站点
        run: python tools/build.py
      - name: 孪生页检查（中英两版都在）
        run: python tools/check_twins.py

  # 文档示例的真编译验证需要 jhyy.exe —— 只能在 Windows 上跑。
  # （原先它挂在 ubuntu runner 上加 `if: runner.os == 'windows'` ⇒ 恒不执行。）
  #
  # `jhyy compile` 要调 `as` / `ld` —— Windows runner 镜像里没有，
  # 所以这道门必须自己装工具链（跟编译器仓的 CI 同一套：MSYS2 UCRT64）。
  examples:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 取编译器仓（给示例验证供料）
        uses: actions/checkout@v4
        with:
          repository: JiHuiYiYou/JiHuiYiYou-compiler
          path: vendor/JiHuiYiYou
      - name: 装工具链（jhyy 汇编 / 链接要 as + ld）
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            python
      - name: 文档示例真编译验证
        shell: msys2 {0}
        run: |
          exe="$(pwd)/vendor/JiHuiYiYou/compiler/build/bin/jhyy.exe"
          # 诊断信息用 ::notice:: / ::error:: 发出去 —— 它们会变成 check-run 的
          # annotation，**不用 admin 权限就能从 API 读到**（日志要 admin）。
          echo "::notice::exe=$exe"
          echo "::notice::exists=$([ -f "$exe" ] && echo yes || echo no)"
          echo "::notice::gcc=$(command -v gcc 2>&1)"
          echo "::notice::as=$(command -v as 2>&1)"
          echo "::notice::ld=$(command -v ld 2>&1)"
          echo "::notice::python=$(command -v python 2>&1)"
          if [ ! -f "$exe" ]; then
            echo "::error::仓里没有 jhyy.exe —— 这道门不能空转"
            exit 1
          fi
          # 编译器找 gcc 有四层优先级；显式钉死 JHY_GCC，绕开 PATH 歧义
          # （runner 镜像自带一套旧 MSYS2 在 C:\mingw64，setup-msys2 装的在
          #  C:\msys64 —— 两套同时在 PATH 上，靠 PATH 找会挑中旧的那套）。
          if command -v gcc >/dev/null 2>&1; then
            export JHY_GCC="$(cygpath -w "$(command -v gcc)")"
            echo "::notice::JHY_GCC=$JHY_GCC"
          else
            echo "::error::找不到 gcc —— jhyy compile 要用它汇编 / 链接"
            exit 1
          fi
          # 用 setup-python 装的那个解释器，别赌 msys2 的 python 在不在
          PY="python"
          if [ -n "$pythonLocation" ] && [ -f "$pythonLocation/python.exe" ]; then
            PY="$(cygpath -u "$pythonLocation")/python.exe"
          fi
          echo "::notice::PY=$PY"
          export JHYY="$(cygpath -w "$exe")"
          echo "::notice::JHYY=$JHYY"
          # ⚠️ msys2 的 shell 默认带 -e —— 检查一失败就中断整个脚本，
          #    后面打印日志那几行根本走不到（失败信息全丢）。这里自己收退出码。
          rc=0
          "$PY" tools/check_examples.py > examples.log 2>&1 || rc=$?
          cat examples.log
          # 把日志与失败原因做成 annotation（公开可读，不用 admin 权限下日志）
          echo "::notice::tail=$(tail -c 1200 examples.log | tr -d '\r' | tr '\n' '|')"
          grep -E "错误|失败|error|Error|not found|无法|找不到" examples.log | head -8 | sed 's/^/::error::/' || true
          exit $rc

  deploy:
    needs: [build, twins]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
